
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Đăng nhập / Đăng ký - TECH SHOP</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="bootstrap-5.0.2/css/bootstrap.rtl.min.css" rel="stylesheet" />
    <link href="bootstrap-5.0.2/Web-Ban-Hang.css" rel="stylesheet" />
    <link href="bootstrap-5.0.2/Web-Ban_Hang-2.css" rel="stylesheet" />
    <!-- Tải Font Awesome (bộ icon) từ CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            font-family: sans-serif;
        }
    </style>
</head>
<body>
    <div class="auth-container text-center">
        <!-- Form Đăng nhập -->
        <form class="auth-form active" id="login-form">
            <h2 class="form-heading">Đăng nhập</h2>
            <div class="input-group">
                <input required placeholder=" " name="email" id="login-email" type="email" />
                <label class="label" for="login-email">Email</label>
            </div>
            <div class="input-group">
                <input required placeholder=" " name="password" id="login-password" type="password" />
                <label class="label" for="login-password">Mật khẩu</label>
                <i class="fas fa-eye password-toggle" data-target="login-password"></i>
            </div>
            <div class="forget-password">
                <a href="#">Quên mật khẩu?</a>
            </div>
            <button class="submit-btn" type="submit">Đăng nhập</button>
            <div class="divider-text">hoặc</div>
            <div class="social-login">
                <button type="button" class="btn btn-google"><i class="fab fa-google"></i> Tiếp tục với Google</button>
                <button type="button" class="btn btn-facebook"><i class="fab fa-facebook-f"></i> Tiếp tục với Facebook</button>
            </div>
            <div class="switch-form-link">
                Bạn chưa có tài khoản? <a id="show-register-form" class="text-success">Đăng ký</a>
            </div>
        </form>

        <!-- Form Đăng ký -->
        <form class="auth-form" id="register-form">
            <h2 class="form-heading">Đăng ký</h2>
            <div class="input-group">
                <input required placeholder=" " name="fullname" id="fullname" type="text" />
                <label class="label" for="fullname">Họ và tên</label>
            </div>
            <div class="input-group">
                <input required placeholder=" " name="email" id="register-email" type="email" />
                <label class="label" for="register-email">Email</label>
            </div>
            <div class="input-group">
                <input required placeholder=" " name="password" id="register-password" type="password" />
                <label class="label" for="register-password">Mật khẩu</label>
                <i class="fas fa-eye password-toggle" data-target="register-password"></i>
            </div>
            <div class="input-group">
                <input required placeholder=" " name="confirm-password" id="confirm-password" type="password" />
                <label class="label" for="confirm-password">Xác nhận mật khẩu</label>
                <i class="fas fa-eye password-toggle" data-target="confirm-password"></i>
            </div>
            <button class="submit-btn" type="submit">Đăng ký</button>
            <div class="switch-form-link">
                Bạn đã có tài khoản? <a id="show-login-form" class="text-success">Đăng nhập</a>
            </div>
        </form>
    </div>

    <!-- JavaScript -->
    <script src="bootstrap-5.0.2/js/bootstrap.bundle.min.js"></script>
    <script src="bootstrap-5.0.2/Web-Bang-Hang.js"></script>

</body>
</html>
