<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title></title>
    <link href="Admin.css" rel="stylesheet" />
    <link href="../bootstrap-5.0.2/css/bootstrap.rtl.min.css" rel="stylesheet" />
</head>
<body>
    <form action="/categories/save" method="POST" enctype="multipart/form-data" class="p-4">
        <input type="hidden" id="categoryId" name="categoryId">

        <h3 id="formCategoryTitle">Thêm danh mục mới</h3>
        <hr>

        <div class="mb-3">
            <label for="categoryName" class="form-label">Tên danh mục</label>
            <input type="text" class="form-control" id="categoryName" name="categoryName" required>
        </div>
        <div class="mb-3">
            <label for="categoryDesc" class="form-label">Mô tả</label>
            <textarea class="form-control" id="categoryDesc" name="categoryDesc"></textarea>
        </div>
        <div class="mb-3">
            <label for="parentCategory" class="form-label">Danh mục cha</label>
            <select class="form-select" id="parentCategory" name="parentCategory">
                <!-- Bạn nên tải động danh sách danh mục ở đây -->
                <option value="0">Không</option>
                <option value="1">Điện thoại</option>
                <option value="2">Laptop</option>
            </select>
        </div>
        <div class="mb-3">
            <label for="categoryImage" class="form-label">Hình ảnh đại diện</label>
            <input type="file" class="form-control" id="categoryImage" name="categoryImage">
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-primary">Lưu danh mục</button>
            <a href="/#categories" class="btn btn-secondary">Hủy</a>
        </div>
    </form>


</body>
</html>
